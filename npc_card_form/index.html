<style>
  :root{
    --bg:#0f1218;
    --panel:#171b23;
    --panel-alt:#1e2430;
    --border:#2a3140;
    --border-soft:#232935;
    --text:#dfe2e8;
    --text-dim:#8891a3;
    --accent:#6fa08e;
    --accent-strong:#8dc2ac;
    --accent-soft:rgba(111,160,142,0.12);
    --danger:#b56548;
    --danger-soft:rgba(181,101,72,0.14);
    --mono:'JetBrains Mono','Courier New',monospace;
    --serif:'Noto Serif TC','Songti TC','STSong',serif;
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% -10%, rgba(111,160,142,0.07), transparent 45%),
      radial-gradient(circle at 100% 0%, rgba(181,101,72,0.05), transparent 40%),
      var(--bg);
    color:var(--text);
    font-family:var(--sans);
    padding:24px 16px 56px;
    line-height:1.5;
  }
  .wrap{max-width:920px;margin:0 auto;}
  header{margin-bottom:18px;border-bottom:1px solid var(--border-soft);padding-bottom:14px;}
  header .eyebrow{
    font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--accent);
    text-transform:uppercase;margin-bottom:6px;
  }
  header h1{
    font-family:var(--serif);font-weight:700;font-size:24px;margin:0 0 5px;color:#f0f1f4;
    letter-spacing:.02em;
  }
  header p{margin:0;color:var(--text-dim);font-size:13px;}

  .toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .btn{
    border:1px solid var(--border);background:var(--panel-alt);color:var(--text);
    padding:9px 15px;border-radius:7px;font-size:13px;cursor:pointer;font-family:var(--sans);
    transition:border-color .15s, color .15s, background .15s;
  }
  .btn.primary{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-strong);font-weight:600;}
  .btn.primary:hover{background:rgba(111,160,142,0.22);}
  .btn.ghost{color:var(--danger);border-color:rgba(181,101,72,0.35);}
  .btn.ghost:hover{border-color:var(--danger);background:var(--danger-soft);}
  .btn:hover:not(.primary):not(.ghost){border-color:var(--accent);color:var(--accent-strong);}

  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;border-bottom:1px solid var(--border-soft);padding-bottom:12px;}
  .tab{
    display:flex;align-items:center;gap:8px;background:var(--panel-alt);border:1px solid var(--border);
    border-radius:7px 7px 0 0;padding:7px 8px 7px 13px;font-size:12.5px;cursor:pointer;color:var(--text-dim);
    max-width:160px;
  }
  .tab.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-strong);}
  .tab .label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tab .close{color:var(--text-dim);border:none;background:transparent;cursor:pointer;font-size:13px;padding:0 2px;}
  .tab .close:hover{color:var(--danger);}
  .empty-state{color:var(--text-dim);font-size:13.5px;padding:40px 10px;text-align:center;border:1px dashed var(--border);border-radius:12px;}

  .panel{
    background:var(--panel);border:1px solid var(--border-soft);border-radius:12px;
    padding:18px 18px 20px;margin-bottom:16px;
  }
  .panel h2{
    font-family:var(--serif);font-size:14.5px;margin:0 0 12px;color:#eceef1;
    display:flex;align-items:center;gap:8px;
  }
  .panel h2 .n{
    font-family:var(--mono);font-size:11px;color:var(--accent);border:1px solid var(--border);
    border-radius:4px;padding:1px 6px;
  }

  .paste-panel textarea{
    width:100%;min-height:110px;background:var(--panel-alt);border:1px solid var(--border);
    color:var(--text);padding:10px;border-radius:6px;font-size:13px;font-family:var(--mono);resize:vertical;
  }
  .paste-panel textarea:focus{outline:none;border-color:var(--accent);}
  .paste-hint{font-size:11.5px;color:var(--text-dim);margin-top:7px;}
  .paste-status{font-size:12px;color:var(--accent-strong);margin-top:7px;min-height:16px;}

  .row-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  @media(max-width:640px){.row-grid{grid-template-columns:1fr;}}
  .field label{display:block;font-size:11.5px;color:var(--text-dim);margin-bottom:5px;font-family:var(--mono);}
  .field input, .field textarea{
    width:100%;background:var(--panel-alt);border:1px solid var(--border);color:var(--text);
    padding:9px 10px;border-radius:6px;font-size:14px;font-family:var(--sans);
  }
  .field input:focus, .field textarea:focus{outline:none;border-color:var(--accent);}
  .field input.dice{font-family:var(--mono);color:var(--danger);}
  .mode-toggle{display:flex;gap:0;border:1px solid var(--border);border-radius:6px;overflow:hidden;width:fit-content;}
  .mode-toggle button{
    background:var(--panel-alt);border:none;color:var(--text-dim);padding:7px 14px;font-size:12.5px;
    cursor:pointer;font-family:var(--sans);
  }
  .mode-toggle button.active{background:var(--accent-soft);color:var(--accent-strong);}

  .chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
  .chip{
    background:transparent;border:1px dashed var(--border);color:var(--text-dim);
    padding:5px 10px;border-radius:14px;font-size:12px;cursor:pointer;font-family:var(--mono);
  }
  .chip:hover{border-color:var(--accent);color:var(--accent-strong);}
  .chip-group-label{font-size:11px;color:var(--text-dim);width:100%;margin:6px 0 -2px;font-family:var(--mono);}
  .chip-group-label:first-child{margin-top:0;}
  .custom-skill-row{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center;}
  .custom-skill-row input{
    background:var(--panel-alt);border:1px solid var(--border);color:var(--text);
    padding:6px 9px;border-radius:14px;font-size:12.5px;font-family:var(--sans);
  }
  .custom-skill-row input:focus{outline:none;border-color:var(--accent);}
  .custom-skill-row input.cs-name{flex:1 1 160px;min-width:120px;}
  .custom-skill-row input.cs-val{width:88px;font-family:var(--mono);}
  .custom-skill-row .add-custom-btn{
    background:var(--accent-soft);border:1px solid var(--accent);color:var(--accent-strong);
    padding:6px 13px;border-radius:14px;font-size:12.5px;cursor:pointer;font-family:var(--sans);white-space:nowrap;
  }
  .custom-skill-row .add-custom-btn:hover{background:rgba(111,160,142,0.22);}

  #rows{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
  @media(max-width:640px){#rows{grid-template-columns:1fr 1fr;}}
  @media(max-width:420px){#rows{grid-template-columns:1fr;}}
  .skill-cell{
    display:grid;grid-template-columns:1fr 56px 22px;gap:5px;align-items:center;
    background:var(--panel-alt);border:1px solid var(--border);border-radius:7px;padding:6px;
  }
  .skill-cell input{
    background:transparent;border:none;color:var(--text);font-size:12.5px;font-family:var(--sans);
    padding:3px 2px;width:100%;
  }
  .skill-cell input.val{font-family:var(--mono);text-align:center;border-left:1px solid var(--border);}
  .skill-cell input:focus{outline:none;}
  .skill-cell .rm{
    background:transparent;border:none;color:var(--danger);cursor:pointer;font-size:13px;
    width:22px;height:22px;
  }
  .skill-cell .rm:hover{color:#e08464;}
  .add-row-btn{
    background:var(--panel-alt);border:1px dashed var(--border);color:var(--accent-strong);
    padding:8px;border-radius:6px;cursor:pointer;font-size:12.5px;font-family:var(--sans);width:100%;
  }
  .add-row-btn:hover{border-color:var(--accent);}

  .notes textarea{min-height:64px;resize:vertical;font-size:12.5px;font-family:var(--mono);}
  .notes .hint{font-size:11.5px;color:var(--text-dim);margin-top:6px;}

  .output-panel{border-color:var(--accent);}
  .cmd-box{
    font-family:var(--mono);font-size:13px;background:#0b0e13;border:1px solid var(--border);
    border-radius:8px;padding:14px;color:var(--accent-strong);white-space:pre-wrap;word-break:break-all;
    min-height:24px;
  }
  .copy-row{display:flex;gap:10px;margin-top:12px;}
  .out-field{margin-bottom:14px;}
  .out-field label{display:block;font-size:11.5px;color:var(--text-dim);margin-bottom:5px;font-family:var(--mono);}
  .cmd-box.small{min-height:auto;padding:9px 12px;font-size:13px;margin-bottom:8px;}
  .copy-btn{
    background:var(--accent-soft);border:1px solid var(--accent);color:var(--accent-strong);
    padding:9px 16px;border-radius:6px;cursor:pointer;font-size:13px;font-family:var(--sans);
  }
  .copy-btn:hover{background:rgba(111,160,142,0.22);}
  .copy-btn.copied{background:var(--accent);color:#0b0e13;}
  .empty-hint{color:var(--text-dim);font-size:12px;padding:4px 2px;grid-column:1/-1;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">D!ce Bot — NPC 卡資料整理工具</div>
    <h1>NPC 卡建立表單</h1>
    <p>貼上劇本資訊自動辨識，或手動填寫，整理好後到 Discord 打 <code>.npc</code>，點按鈕跳出表單，把下方欄位分別複製貼進去（GM 專用）。</p>
  </header>

  <div class="toolbar">
    <button class="btn primary" id="createBtn">＋ 建立 NPC</button>
    <button class="btn ghost" id="clearBtn">清空目前分頁</button>
  </div>

  <div class="tabs" id="tabs"></div>

  <div id="content"></div>

</div>

<script>
const ATTR_CODES = ['STR','CON','SIZ','DEX','APP','INT','POW','EDU','SAN','LUK','MOV'];
const ATTR_CHIPS = ['力量','體質','體型','敏捷','外貌','智力','意志','教育','SAN','幸運','MOV','MP'];
const ATTR_CN_MAP = { STR:'力量', CON:'體質', SIZ:'體型', DEX:'敏捷', APP:'外貌', INT:'智力', POW:'意志', EDU:'教育', LUK:'幸運', SAN:'SAN' };
const SAN_ALIASES = ['理智值','理智','聖智值'];
function normalizeFieldName(name){
  if(!name) return name;
  const upper = name.toUpperCase();
  if(ATTR_CN_MAP[upper]) return ATTR_CN_MAP[upper];
  if(SAN_ALIASES.includes(name)) return 'SAN';
  return name;
}
const SKILL_CHIPS = ['鬥毆','格鬥','閃避','偵查','聆聽','潛行','急救','心理學','信用','圖書館使用','說服','鎖匠'];

let tabs = [];
let activeId = null;
let tabCounter = 0;

function newTab(){
  tabCounter += 1;
  return {
    id: 'npc' + tabCounter,
    name: '',
    hp: '',
    db: '',
    rows: [],   // {name, value}
    notes: '',
    pasteText: ''
  };
}

function createTab(){
  const t = newTab();
  tabs.push(t);
  activeId = t.id;
  renderAll();
}

function closeTab(id){
  tabs = tabs.filter(t => t.id !== id);
  if(activeId === id){
    activeId = tabs.length ? tabs[tabs.length - 1].id : null;
  }
  renderAll();
}

function getActive(){
  return tabs.find(t => t.id === activeId) || null;
}

document.getElementById('createBtn').addEventListener('click', createTab);
document.getElementById('clearBtn').addEventListener('click', () => {
  const t = getActive();
  if(!t) return;
  t.name = ''; t.hp = ''; t.db = '';
  t.rows = []; t.notes = ''; t.pasteText = '';
  renderAll();
});

// ---------- parsing ----------
function parseNpcText(raw){
  const text = raw.replace(/\r/g, '');
  const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
  const result = { name: '', hp: null, db: null, fields: [], notes: [] };
  const seen = new Set();

  function addField(name, value){
    name = normalizeFieldName((name || '').trim());
    if(!name || value === null || value === undefined || isNaN(value)) return;
    if(seen.has(name)) return;
    seen.add(name);
    result.fields.push({ name, value: Math.round(value) });
  }

  if(lines.length > 0){
    let first = lines[0].replace(/^\s*\d+[.、]\s*/, '');
    let cut = first.search(/[，,]/);
    let namePart = cut >= 0 ? first.slice(0, cut) : first;
    namePart = namePart.replace(/[（(][^）)]*[）)]/g, '').trim();
    let cut2 = namePart.search(/、/);
    if(cut2 >= 0) namePart = namePart.slice(0, cut2);
    result.name = namePart.trim();
  }

  {
    const m = text.match(/(?:平均生命值|生命值|HP|耐久力)[:：]?\s*(\d{1,3})(?:\s*[-~至]\s*(\d{1,3}))?/);
    if(m){
      const a = parseInt(m[1], 10);
      const b = m[2] ? parseInt(m[2], 10) : null;
      result.hp = b ? Math.round((a + b) / 2) : a;
    }
  }

  {
    const m = text.match(/(?:平均伤害加值|平均傷害加值|伤害加值|傷害加值|DB)\s*(?:\(DB\))?\s*[:：]?\s*([+\-]?\d*[Dd]\d+(?:[×xX*]\d+)?|\+0|[+\-]\d+)/);
    if(m) result.db = m[1];
  }

  const diceLineRe = /^\*?\s*([A-Za-z]{2,4})\*?\s+\d+[Dd]\d+(?:[×xX*]\d+)?\s+(\d{1,3})(?:-(\d{1,3}))?\s*\.?$/;
  const handledLines = new Set();
  lines.forEach((line, idx) => {
    const m = line.match(diceLineRe);
    if(m){
      const code = m[1].toUpperCase();
      const a = parseInt(m[2], 10);
      const b = m[3] ? parseInt(m[3], 10) : null;
      const val = b ? Math.round((a + b) / 2) : a;
      if(ATTR_CODES.includes(code)){
        addField(code, val);
        handledLines.add(idx);
      }
    }
  });

  {
    const re = /([\u4e00-\u9fa5A-Za-z().（）\/×0-9]{1,16}?)\s*(\d{1,3})\s*%/g;
    let m;
    while((m = re.exec(text)) !== null){
      let label = m[1].replace(/^[、,，:：\s]+/, '').replace(/\s+/g, '');
      if(!label || /^[\d.]+$/.test(label)) continue;
      addField(label, parseInt(m[2], 10));
    }
  }

  {
    const m = text.match(/(?:移动|移動|MOV)[:：]?[^(（]*[(（]\s*(?:平均|均值)?\s*(\d{1,3})\s*[)）]/);
    if(m) addField('MOV', parseInt(m[1], 10));
  }

  lines.forEach((line, idx) => {
    if(handledLines.has(idx)) return;
    if(line.includes('%')) return;
    if(/\d+[Dd]\d+/.test(line)) return;
    if(/攻击次数|攻擊次數|每轮|每回合/.test(line)) return;
    {
      const re = /\b(STR|CON|SIZ|DEX|APP|INT|POW|EDU|SAN|LUK|MOV)\b\s*[:：]?\s*(\d{1,3})/gi;
      let m;
      while((m = re.exec(line)) !== null) addField(m[1].toUpperCase(), parseInt(m[2], 10));
    }
    {
      const re = /([\u4e00-\u9fa5]{2,5})\s*[:：]?\s*(\d{1,3})(?!\d)/g;
      let m;
      while((m = re.exec(line)) !== null){
        const label = m[1];
        if(['傷害加值','伤害加值','平均傷害','平均生命'].some(k => label.includes(k))) continue;
        addField(label, parseInt(m[2], 10));
      }
    }
  });

  lines.forEach(line => {
    if(/傷害|伤害|理智|SAN/i.test(line) && !/^属性|^屬性/.test(line)) result.notes.push(line);
  });
  result.notes = [...new Set(result.notes)];

  return result;
}

function applyParsed(t, parsed){
  if(parsed.name) t.name = parsed.name;
  if(parsed.hp !== null) t.hp = parsed.hp;
  if(parsed.db !== null) t.db = parsed.db;
  t.rows = parsed.fields.map(f => ({ name: f.name, value: f.value }));
  t.notes = parsed.notes.join('\n');
}

// ---------- rendering ----------
function escapeAttr(s){ return (s || '').replace(/"/g, '&quot;'); }

function renderAll(){
  renderTabs();
  renderContent();
}

function renderTabs(){
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  tabs.forEach(t => {
    const div = document.createElement('div');
    div.className = 'tab' + (t.id === activeId ? ' active' : '');
    div.innerHTML = `<span class="label">${escapeAttr(t.name) || '（未命名 NPC）'}</span>`;
    div.addEventListener('click', (e) => { if(e.target.classList.contains('close')) return; activeId = t.id; renderAll(); });
    const closeBtn = document.createElement('button');
    closeBtn.className = 'close';
    closeBtn.textContent = '✕';
    closeBtn.title = '關閉這個分頁';
    closeBtn.addEventListener('click', (e) => { e.stopPropagation(); closeTab(t.id); });
    div.appendChild(closeBtn);
    tabsEl.appendChild(div);
  });
}

function renderContent(){
  const content = document.getElementById('content');
  content.innerHTML = '';
  const t = getActive();
  if(!t){
    content.innerHTML = `<div class="empty-state">目前沒有開啟的 NPC 分頁，按上方「＋ 建立 NPC」開始。</div>`;
    return;
  }

  content.innerHTML = `
    <div class="panel paste-panel">
      <h2><span class="n">1</span> 貼上劇本資訊（自動辨識）</h2>
      <textarea id="pasteBox" placeholder="把劇本 / 團本裡的 NPC 屬性技能資料整段貼在這裡，貼上後會自動辨識並填入下方欄位">${escapeAttr(t.pasteText)}</textarea>
      <div class="paste-hint">支援常見格式：屬性骰點表（STR 4D10×5 110）、固定數值列（STR 50 CON 60 ...）、技能百分比（偵查 60%）。辨識結果會覆蓋下方欄位，貼上後請自行檢查校正。</div>
      <div class="paste-status" id="pasteStatus"></div>
    </div>

    <div class="panel">
      <h2><span class="n">2</span> 基本資料</h2>
      <div class="row-grid" style="margin-bottom:14px;">
        <div class="field">
          <label>名稱（不可有空白）</label>
          <input type="text" id="npcName" placeholder="例：深潛者" value="${escapeAttr(t.name)}">
        </div>
        <div class="field">
          <label>HP</label>
          <input type="number" id="npcHP" placeholder="例：15" value="${escapeAttr(String(t.hp))}">
        </div>
        <div class="field">
          <label>DB 傷害加值（骰式）</label>
          <input type="text" class="dice" id="npcDB" placeholder="例：+1D4" value="${escapeAttr(t.db)}">
        </div>
      </div>
    </div>

    <div class="panel">
      <h2><span class="n">3</span> 屬性與技能</h2>
      <div class="chip-group-label">快速加入屬性</div>
      <div class="chip-row" id="attrChips"></div>
      <div class="chip-group-label">快速加入常用技能</div>
      <div class="chip-row" id="skillChips"></div>
      <div class="chip-group-label">自訂技能／屬性</div>
      <div class="custom-skill-row">
        <input type="text" class="cs-name" id="customSkillName" placeholder="技能／屬性名稱">
        <input type="number" class="cs-val" id="customSkillVal" placeholder="數值（可留空）">
        <button type="button" class="add-custom-btn" id="addCustomSkillBtn">＋ 加入</button>
      </div>
      <div id="rows"></div>
      <button class="add-row-btn" id="addRowBtn">＋ 新增自訂欄位</button>
    </div>

    <div class="panel notes">
      <h2><span class="n">4</span> 備註（武器傷害／法術／理智損失等，不會寫入指令）</h2>
      <textarea id="notesArea" placeholder="例：.38 口徑左輪手槍 傷害 1D10；擒抱 傷害 特殊">${escapeAttr(t.notes)}</textarea>
      <div class="hint">.npc 卡只存 HP、DB、與技能百分比三種欄位，其餘文字資訊記在這裡自己留存。</div>
    </div>

    <div class="panel output-panel">
      <h2><span class="n">5</span> 複製到 Discord 表單</h2>
      <div class="paste-hint" style="margin-top:0;margin-bottom:12px;">到 Discord 打 <code>.npc</code>，跳出面板後點「➕ 新增/覆蓋 NPC」或「✏️ 局部更新 NPC」，把下面對應欄位複製貼過去即可。</div>

      <div class="out-field">
        <label>名稱</label>
        <div class="cmd-box small" id="outName"></div>
        <button class="copy-btn" data-copy="outName">複製</button>
      </div>
      <div class="out-field">
        <label>HP</label>
        <div class="cmd-box small" id="outHP"></div>
        <button class="copy-btn" data-copy="outHP">複製</button>
      </div>
      <div class="out-field">
        <label>DB 傷害加值</label>
        <div class="cmd-box small" id="outDB"></div>
        <button class="copy-btn" data-copy="outDB">複製</button>
      </div>
      <div class="out-field">
        <label>屬性／技能（一行一個「名稱=數值」，對應表單的「屬性／技能」欄位）</label>
        <div class="cmd-box" id="outSkills"></div>
        <button class="copy-btn" data-copy="outSkills">複製</button>
      </div>
    </div>
  `;

  bindContentEvents(t);
  renderRows(t);
  buildOutput(t);
}

function bindContentEvents(t){
  const pasteBox = document.getElementById('pasteBox');
  const status = document.getElementById('pasteStatus');
  pasteBox.addEventListener('input', () => { t.pasteText = pasteBox.value; });
  pasteBox.addEventListener('paste', () => {
    setTimeout(() => {
      t.pasteText = pasteBox.value;
      const parsed = parseNpcText(pasteBox.value);
      applyParsed(t, parsed);
      status.textContent = `已辨識：名稱「${t.name || '（未抓到）'}」、${t.rows.length} 個屬性/技能欄位${t.hp !== '' && t.hp !== null ? '、HP ' + t.hp : ''}${t.db ? '、DB ' + t.db : ''}`;
      renderContent();
    }, 0);
  });

  document.getElementById('npcName').addEventListener('input', e => { t.name = e.target.value; buildOutput(t); renderTabs(); });
  document.getElementById('npcHP').addEventListener('input', e => { t.hp = e.target.value; buildOutput(t); });
  document.getElementById('npcDB').addEventListener('input', e => { t.db = e.target.value; buildOutput(t); });
  document.getElementById('notesArea').addEventListener('input', e => { t.notes = e.target.value; });

  buildChips(document.getElementById('attrChips'), ATTR_CHIPS, t);
  buildChips(document.getElementById('skillChips'), SKILL_CHIPS, t);

  const csName = document.getElementById('customSkillName');
  const csVal = document.getElementById('customSkillVal');
  const addCustomSkill = () => {
    const name = csName.value.trim();
    if(!name) { csName.focus(); return; }
    if(t.rows.some(r => r.name === name)) { csName.value = ''; csName.focus(); return; }
    const rawVal = csVal.value.trim();
    const value = rawVal === '' ? null : parseInt(rawVal, 10);
    t.rows.push({ name, value: isNaN(value) ? null : value });
    csName.value = '';
    csVal.value = '';
    renderRows(t);
    buildOutput(t);
    csName.focus();
  };
  document.getElementById('addCustomSkillBtn').addEventListener('click', addCustomSkill);
  csName.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); addCustomSkill(); } });
  csVal.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); addCustomSkill(); } });

  document.getElementById('addRowBtn').addEventListener('click', () => { t.rows.push({ name: '', value: null }); renderRows(t); buildOutput(t); });

  document.querySelectorAll('.copy-btn[data-copy]').forEach(btn => {
    btn.addEventListener('click', () => {
      const box = document.getElementById(btn.dataset.copy);
      navigator.clipboard.writeText(box.textContent).then(() => {
        const original = btn.textContent;
        btn.textContent = '已複製 ✓';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = original; btn.classList.remove('copied'); }, 1200);
      }).catch(() => { btn.textContent = '複製失敗，請手動選取'; });
    });
  });
}

function buildChips(container, list, t){
  container.innerHTML = '';
  list.forEach(name => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.type = 'button';
    b.textContent = '+ ' + name;
    b.addEventListener('click', () => {
      if(t.rows.some(r => r.name === name)) return;
      t.rows.push({ name, value: null });
      renderRows(t);
      buildOutput(t);
    });
    container.appendChild(b);
  });
}

function renderRows(t){
  const rowsEl = document.getElementById('rows');
  rowsEl.innerHTML = '';
  if(t.rows.length === 0){
    rowsEl.innerHTML = `<div class="empty-hint">尚未加入任何屬性或技能，點上方快速按鈕，或按「＋ 新增自訂欄位」。</div>`;
    return;
  }
  t.rows.forEach((r, i) => {
    const div = document.createElement('div');
    div.className = 'skill-cell';
    div.innerHTML = `
      <input type="text" class="name" value="${escapeAttr(r.name)}" placeholder="欄位名稱">
      <input type="number" class="val" value="${r.value === null || r.value === undefined ? '' : r.value}" placeholder="數值">
      <button class="rm" title="移除">✕</button>
    `;
    div.querySelector('.name').addEventListener('input', e => { t.rows[i].name = e.target.value; buildOutput(t); });
    div.querySelector('.val').addEventListener('input', e => { t.rows[i].value = e.target.value === '' ? null : parseInt(e.target.value, 10); buildOutput(t); });
    div.querySelector('.rm').addEventListener('click', () => { t.rows.splice(i, 1); renderRows(t); buildOutput(t); });
    rowsEl.appendChild(div);
  });
}

function buildOutput(t){
  const outName = document.getElementById('outName');
  if(!outName) return;
  const name = (t.name || '').trim();
  outName.textContent = name || '（尚未填寫）';

  const hp = String(t.hp === null || t.hp === undefined ? '' : t.hp).trim();
  document.getElementById('outHP').textContent = hp !== '' ? String(parseInt(hp, 10)) : '（未填）';

  const db = (t.db || '').trim();
  document.getElementById('outDB').textContent = db || '（未填）';

  const skillLines = t.rows
    .filter(r => r.name && r.value !== null && r.value !== undefined && !isNaN(r.value))
    .map(r => `${r.name}=${r.value}`);
  document.getElementById('outSkills').textContent = skillLines.length ? skillLines.join('\n') : '（尚未加入任何屬性/技能）';
}

renderAll();
</script>
</body>
</html>
